<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Velora review</title>
<style>
/* Velora dashboard. Phone first. One accent (blue) plus reserved status colours.
   Status always ships with an icon and a word, never colour alone. */
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #6b6a66;
  --line: #e1e0db;
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.16);
  --good: #1a7f37;
  --warn-bg: #fff1cc;
  --warn-ink: #6b4500;
  --bad-bg: #fde3e2;
  --bad-ink: #8a1c1b;
  --ok-bg: #e3f4e8;
  --ok-ink: #14532d;
  --info-bg: #e8eef8;
  --info-ink: #1f3a66;
  --on-accent: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #a09f95;
    --line: #34332f;
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.22);
    --good: #4cc26d;
    --warn-bg: #3d2f0a;
    --warn-ink: #ffd98a;
    --bad-bg: #4a1716;
    --bad-ink: #ffb3b1;
    --ok-bg: #12301c;
    --ok-ink: #9be0b0;
    --info-bg: #17263f;
    --info-ink: #b6cdf2;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a09f95; --line: #34332f;
  --accent: #3987e5; --accent-soft: rgba(57, 135, 229, 0.22); --good: #4cc26d;
  --warn-bg: #3d2f0a; --warn-ink: #ffd98a; --bad-bg: #4a1716; --bad-ink: #ffb3b1;
  --ok-bg: #12301c; --ok-ink: #9be0b0; --info-bg: #17263f; --info-ink: #b6cdf2;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
h1 { font-size: 1.35rem; margin: 18px 0 4px; }
h2 { font-size: 1.05rem; margin: 28px 0 10px; }
h3 { font-size: 0.95rem; margin: 0 0 6px; }
p { margin: 0 0 8px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.82rem; }
.num { font-variant-numeric: tabular-nums; }

/* nav */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 4px; padding-bottom: 0; flex-wrap: wrap; }
.brand { font-weight: 700; margin-right: 12px; padding: 12px 0; }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav a { color: var(--ink-2); text-decoration: none; padding: 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav a:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* banner and markers */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; margin: 14px 0 6px; border: 1px solid transparent; }
.banner .icon { font-weight: 700; flex: none; width: 1.4em; text-align: center; }
.banner.green { background: var(--ok-bg); color: var(--ok-ink); }
.banner.amber { background: var(--warn-bg); color: var(--warn-ink); }
.banner.red { background: var(--bad-bg); color: var(--bad-ink); }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--info-bg); color: var(--info-ink); border: 1px solid var(--line); }
.chip.provisional { background: transparent; color: var(--ink); border: 1px dashed var(--ink-3); }
.chip.sample { background: var(--warn-bg); color: var(--warn-ink); }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.bad { background: var(--bad-bg); color: var(--bad-ink); }
.chip.neutral { background: var(--surface); color: var(--ink-2); }

/* cards and grids */
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid.cols-2, .grid.cols-3, .grid.cols-5 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .grid.cols-3 { grid-template-columns: repeat(3, 1fr); } .grid.cols-5 { grid-template-columns: repeat(3, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card header { flex-wrap: wrap; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi .label { color: var(--ink-2); font-size: 0.82rem; }
.kpi .value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .vs { font-size: 0.82rem; color: var(--ink-2); }
dl.pairs { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 8px; }
dl.pairs dt { color: var(--ink-2); font-size: 0.85rem; }
dl.pairs dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.action { display: flex; gap: 8px; align-items: baseline; font-weight: 700; margin-top: 4px; }
.action .why { font-weight: 400; color: var(--ink-2); font-size: 0.88rem; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

/* tables */
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
th { color: var(--ink-2); font-weight: 600; font-size: 0.8rem; }
tr:last-child td { border-bottom: 0; }
td.wrap-text { white-space: normal; min-width: 200px; text-align: left; }
caption { text-align: left; padding: 8px 10px; color: var(--ink-2); font-size: 0.82rem; caption-side: top; }

/* charts */
svg { display: block; max-width: 100%; }
.line-chart, .hbars { width: 100%; height: auto; max-width: 560px; }
.range-bar { width: 100%; max-width: 200px; height: 16px; }
.spark { width: 96px; height: 28px; }
.viz-line { stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz-line-muted { stroke: var(--ink-3); }
.viz-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.viz-bar { fill: var(--accent); }
.viz-band { fill: var(--accent-soft); stroke: none; }
.viz-grid { stroke: var(--line); stroke-width: 1; }
.viz-ref { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 3; }
.viz-text { fill: var(--ink); font-size: 11.5px; font-family: inherit; }
.viz-axis { fill: var(--ink-2); font-size: 11px; }
.viz-num { fill: var(--ink-2); font-variant-numeric: tabular-nums; }

footer { margin-top: 32px; color: var(--ink-3); font-size: 0.8rem; }
.empty { padding: 24px; text-align: center; color: var(--ink-2); }

@media (forced-colors: active) {
  .viz-bar, .viz-dot { fill: Highlight; } .viz-line { stroke: Highlight; }
}

/* ---- Performance page ---- channel and series colours are defined once here and used everywhere */
:root {
  --ch-meta: #2a78d6; --ch-gbrand: #c2570c; --ch-gnon: #e5a02a; --ch-pin: #b8336a; --ch-email: #5b8c1a;
  --c-rev: #0b0b0b; --c-spend: #8a8984; --c-mer: #7a5af8; --c-orders: #8796b3; --c-aov: #7a5af8; --c-new: #0e7490; --c-ret: #aeb2ba;
  --good-ink: #1a7f37; --bad-ink2: #b42318; --hit-hover: rgba(42, 120, 214, 0.2);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ch-meta: #5b9cf0; --ch-gbrand: #f08a3c; --ch-gnon: #f2c14e; --ch-pin: #e0679a; --ch-email: #8cc43a;
    --c-rev: #f0efec; --c-spend: #a09f95; --c-mer: #a48dff; --c-orders: #7384a3; --c-aov: #a48dff; --c-new: #36b8d6; --c-ret: #6c7078;
    --good-ink: #4cc26d; --bad-ink2: #ff8a80; --hit-hover: rgba(91, 156, 240, 0.28);
  }
}
:root[data-theme="dark"] {
  --ch-meta: #5b9cf0; --ch-gbrand: #f08a3c; --ch-gnon: #f2c14e; --ch-pin: #e0679a; --ch-email: #8cc43a;
  --c-rev: #f0efec; --c-spend: #a09f95; --c-mer: #a48dff; --c-orders: #7384a3; --c-aov: #a48dff; --c-new: #36b8d6; --c-ret: #6c7078;
  --good-ink: #4cc26d; --bad-ink2: #ff8a80; --hit-hover: rgba(91, 156, 240, 0.28);
}
.perf-head { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 14px; }
.periods { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: flex-start; background: var(--surface); }
.pbtn { font: inherit; font-weight: 600; font-size: 0.88rem; padding: 7px 16px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink-2); cursor: pointer; min-height: 36px; }
.pbtn:last-child { border-right: 0; }
.pbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.period-line { margin: 0; }
/* the nine KPI tiles are charts: 1 per row on phones, 2 from 600px, 3 from 900px; an expanded tile spans the row */
.kpis.k9 { grid-template-columns: 1fr; grid-auto-flow: dense; }
@media (min-width: 600px) { .kpis.k9 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .kpis.k9 { grid-template-columns: repeat(3, 1fr); } }
.kpis.k9 .value { font-size: 1.75rem; }
.kpi-delta { min-height: 1.3em; font-size: 0.88rem; font-weight: 600; }
.delta.good { color: var(--good-ink); }
.delta.bad { color: var(--bad-ink2); }
.delta.neutral, .delta.flat, .na-delta { color: var(--ink-2); font-weight: 500; }
.delta .muted { font-weight: 400; }
.kpi .sub { min-height: 1.2em; }
.kpi .def { margin-top: 6px; font-size: 0.74rem; line-height: 1.3; }
.spark-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.spark-row .spark { width: 140px; height: 30px; }
.na { color: var(--ink-3); font-weight: 500; font-style: italic; cursor: help; }
.chart-card h3 { margin-bottom: 2px; }
.chart-card p { margin-bottom: 4px; }
.legend { list-style: none; display: flex; gap: 4px 14px; flex-wrap: wrap; padding: 0; margin: 4px 0 6px; font-size: 0.8rem; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 2px solid transparent; }
.swatch.dashed { height: 0; width: 16px; border-radius: 0; border-width: 0 0 2px; border-style: dashed; background: transparent !important; }
svg.trend { width: 100%; height: auto; max-width: none; }
.viz-series { stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.viz-series.dashed { stroke-dasharray: 5 3; }
.viz-series.thin { stroke-width: 1.4; opacity: 0.7; }
.viz-pt { stroke: var(--surface); stroke-width: 2; }
.viz-hatch { stroke: var(--ink-3); stroke-width: 1.2; opacity: 0.45; }
.hit { fill: transparent; }
.hit:hover { fill: var(--hit-hover); }
.th-btn { font: inherit; font-weight: 600; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.th-btn:hover { color: var(--ink); text-decoration: underline; }
th[aria-sort] { color: var(--ink); }
tr.total-row th, tr.total-row td { border-top: 2px solid var(--line); font-weight: 700; }
tbody th[scope="row"] { text-align: left; font-weight: 600; font-size: inherit; color: var(--ink); background: var(--surface); position: sticky; left: 0; }
td, th[scope="row"] { vertical-align: middle; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
.blist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
.bl-name { font-weight: 600; overflow-wrap: anywhere; }
.bl-val { font-variant-numeric: tabular-nums; }
.bl-track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 3px 0; }
.bl-fill { height: 100%; border-radius: 4px; }
.bl-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 0.8rem; color: var(--ink-2); }
.bl-meta b { color: var(--ink); font-weight: 600; }
dl.defs { display: grid; grid-template-columns: 1fr; gap: 2px 16px; margin: 0 0 12px; font-size: 0.85rem; }
@media (min-width: 720px) { dl.defs { grid-template-columns: 180px 1fr; } }
dl.defs dt { font-weight: 600; margin-top: 6px; }
dl.defs dd { margin: 0; color: var(--ink-2); }

/* ---- Plots first: KPI chart tiles, expand, tooltip ---- */
.grid.cols-1 { grid-template-columns: 1fr; }
.kpi-tile { display: flex; flex-direction: column; gap: 4px; }
.kpi-tile.kpi-wide { grid-column: 1 / -1; }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.kpi-main { min-width: 0; }
.expand-btn { font: inherit; font-size: 0.78rem; font-weight: 600; padding: 4px 10px; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink-2); cursor: pointer; flex: none; }
.expand-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.expand-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.kpi-tile .legend { margin: 2px 0 0; font-size: 0.74rem; }
.kpi-chart { width: 100%; min-width: 0; margin-top: 2px; }
.kpi-chart svg.trend { width: 100%; height: auto; }
.best-worst { color: var(--ink); min-height: 1.3em; line-height: 1.35; }
.kpi-tile .def { margin-top: 2px; }
.viz-tip { position: fixed; z-index: 50; display: none; left: 0; top: 0; max-width: 280px; padding: 7px 10px; border-radius: 8px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  font-size: 0.8rem; line-height: 1.4; white-space: pre-line; pointer-events: none; font-variant-numeric: tabular-nums; }

/* Brief and Test plan pages: read, not scanned. Shared by brief.html and test-plan.html. */
.doc { max-width: 880px; margin: 0 auto; font-size: 16px; line-height: 1.6; }
.doc h1 { font-size: 1.9rem; line-height: 1.25; margin: 24px 0 8px; }
.doc h2 { font-size: 1.3rem; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 1.05rem; line-height: 1.4; margin: 0 0 6px; }
.doc p { margin: 0 0 10px; }
.doc .doc-sub { font-size: 1.05rem; color: var(--ink-2); margin: 0 0 4px; }
.doc .doc-asof { font-size: 0.85rem; color: var(--ink-3); margin: 0 0 8px; }
.doc .doc-lead { font-size: 1.15rem; line-height: 1.55; margin: 12px 0 0; }
.doc .doc-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .doc .doc-grid.two { grid-template-columns: repeat(2, 1fr); } .doc .doc-grid.three { grid-template-columns: repeat(3, 1fr); } }
.doc .card { padding: 18px; break-inside: avoid; page-break-inside: avoid; }
.doc .card p:last-child { margin-bottom: 0; }
.doc .doc-num { display: inline-flex; align-items: center; justify-content: center; width: 2em; height: 2em; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 700; margin-bottom: 10px; }
.doc .doc-table th, .doc .doc-table td { text-align: left; white-space: normal; vertical-align: top; padding: 10px 12px; min-width: 130px; line-height: 1.45; }
.doc .doc-table tr { break-inside: avoid; page-break-inside: avoid; }
.doc .doc-ask { background: var(--info-bg); color: var(--info-ink); border: 2px solid var(--accent); margin-top: 40px; }
.doc .doc-ask h2 { border: 0; margin: 0 0 8px; padding: 0; font-size: 1.2rem; }
.doc .doc-rows { margin: 12px 0 0; }
.doc .doc-rows dt { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); margin-top: 10px; }
.doc .doc-rows dd { margin: 2px 0 0; }
.doc .doc-q { font-weight: 600; margin: 0 0 4px; }
.doc .doc-list { padding-left: 20px; margin: 0; }
.doc .doc-list li { margin-bottom: 10px; }
/* range bar */
.doc .rbar { position: relative; height: 14px; margin: 44px 8px 40px; border-radius: 7px; background: var(--accent-soft); }
.doc .rbar .rfill { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .35; border-radius: 7px; }
.doc .rbar .rmid, .doc .rbar .rbe { position: absolute; top: -6px; bottom: -6px; width: 3px; margin-left: -1.5px; }
.doc .rbar .rmid { background: var(--accent); }
.doc .rbar .rbe { background: var(--bad-ink); width: 2px; margin-left: -1px; }
.doc .rbar .rlab { position: absolute; font-size: 0.8rem; white-space: nowrap; transform: translateX(-50%); color: var(--ink-2); }
.doc .rbar .rlab.top { bottom: 24px; }
.doc .rbar .rlab.bot { top: 24px; }
.doc .rbar .rlab.be { color: var(--bad-ink); }
@media print {
  .top, .banner, .badge-row, footer { display: none !important; }
  body, .doc { background: #fff !important; color: #111 !important; }
  .doc .card, .doc .table-scroll { background: #fff !important; color: #111 !important; border-color: #bbb !important; }
  .doc .muted, .doc .doc-sub, .doc .doc-asof, .doc .rlab, .doc .doc-rows dt { color: #444 !important; }
  .doc .doc-ask { background: #f3f3f3 !important; color: #111 !important; border-color: #111 !important; }
  .doc .doc-num { background: #111 !important; color: #fff !important; }
  .wrap { padding-bottom: 0; max-width: none; }
  .doc h2 { break-after: avoid; }
}
.doc code { font-size: 0.9em; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); overflow-wrap: anywhere; }
.doc ol.doc-list, .doc ul.doc-list { margin: 0 0 14px; padding-left: 24px; }
/* ranked steps on the Brief page */
.doc .doc-steps { list-style: none; padding: 0; margin: 0; }
.doc .doc-steps li { margin-bottom: 10px; padding-left: 4px; }


.rv-top{background:var(--surface);border-bottom:1px solid var(--line)}
.rv-top .wrap{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-bottom:0}
.rv-tabs{display:flex;gap:2px;overflow-x:auto}
.rv-tab{font:inherit;color:var(--ink-2);background:none;border:0;border-bottom:3px solid transparent;padding:0 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.rv-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.rv-btn:focus-visible,.rv-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rv-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rv-panel[hidden]{display:none}
.rv-lock{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:16px}
.rv-card{max-width:380px;width:100%;padding:24px;display:flex;flex-direction:column;gap:10px}
.rv-card h1{margin:0 0 4px;font-size:1.3rem}
.rv-label{font-size:.85rem;color:var(--ink-2)}
.rv-input{font:inherit;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.rv-btn{font:inherit;min-height:44px;padding:10px 12px;border:0;border-radius:8px;cursor:pointer;background:var(--accent);color:var(--on-accent);font-weight:600}
.rv-btn[disabled]{opacity:.6;cursor:wait}
.rv-msg{min-height:1.3em;margin:0;font-size:.9rem;color:var(--bad-ink)}
@media print{
  .rv-top{display:none !important}
  body{background:#fff !important}
  .rv-panel[hidden]{display:none !important}
}
</style>

/* Velora dashboard: the single number formatter. Classic script (works on file://).
 * Attaches to globalThis.Velora.fmt. Every number shown on any page goes through here.
 * Convention: values named *_pct, move_pct and delta_pct_dod are FRACTIONS (0.05 = 5%). */

  var V = (g.Velora = g.Velora || {});

  function percent(n, o) {

/* Velora dashboard: hand-drawn inline SVG charts. Classic script; attaches to Velora.charts.
 * Every function returns an SVG string. Colours come from CSS classes (see style.css) so

(function (g) {
  'use strict';

  function row(label, v) { return v ? '<dt>' + label + '</dt><dd>' + esc(v) + '</dd>' : ''; }

  function testCard(t) {
    var when = [t.when, t.duration].filter(Boolean).join(', ');
    return '<article class="card"><h3>' + esc(t.name) + '</h3><p class="doc-q">' + esc(t.question) + '</p><dl class="doc-rows">' +
      row('How', t.how) + row('When and length', when) + row('Cost', t.cost) + row('Read-out', t.readout) + row('Decision', t.decision) +
      '</dl></article>';
  }

  function render(d) {
    var p = d && d.test_plan;
    if (!p) return '<div class="card empty">No test plan loaded. Run npm run insights:mart.</div>';
    var h = '<div class="doc"><h1>' + esc(p.title) + '</h1>';
    if (p.as_of) h += '<p class="doc-asof">As of ' + esc(p.as_of) + '</p>';
    h += '<p class="doc-sub">' + esc(p.intro) + '</p><p class="doc-lead">' + esc(p.headline) + '</p>';
    h += '<h2>Do now</h2><div class="doc-grid three">' + (p.do_now || []).map(function (x, i) {
      return '<article class="card"><span class="doc-num">' + (i + 1) + '</span><h3>' + esc(x.action) + '</h3><p class="muted">' + esc(x.why) + '</p></article>';
    }).join('') + '</div>';
    h += '<h2>The tests</h2><div class="doc-grid two">' + (p.tests || []).map(testCard).join('') + '</div>';
    h += '<h2>Data to add</h2><div class="table-scroll"><table class="doc-table" aria-label="Data to add"><thead><tr>' +
      ['Item', 'Why', 'Who', 'Unlocks'].map(function (t) { return '<th scope="col">' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (p.data || []).map(function (x) {
        return '<tr><th scope="row">' + esc(x.name) + '</th><td>' + esc(x.why) + '</td><td>' + esc(x.who) + '</td><td>' + esc(x.unlocks) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    if ((p.not_recommended || []).length) {
      h += '<h2>Not recommended</h2><ul class="doc-list">' + p.not_recommended.map(function (x) {
        return '<li><strong>' + esc(x.item) + '.</strong> ' + esc(x.why) + '</li>';
      }).join('') + '</ul>';
    }
    return h + '</div>';
  }

  V.testPlan = { render: render };

  if (g.document && g.document.getElementById && g.document.getElementById('app')) {
    V.app.boot('test-plan', '', '', render);
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* Velora dashboard: Detail page. Classic script; attaches to Velora.detail.
 * Renders window.VELORA_DATA.brief_full ({as_of, title, html}; data/marts/brief_full.json, the long brief
 * converted from markdown to an HTML fragment by npm run insights:mart). The fragment is built from escaped text only. */
(function (g) {
  'use strict';
  var V = (g.Velora = g.Velora || {});
  var esc = V.charts.esc;

  /** Drop the leading H1: the page draws the title itself. */
  function stripH1(html) { return String(html || '').replace(/^\s*<h1>[\s\S]*?<\/h1>\s*/, ''); }

  function render(d) {
    var b = d && d.brief_full;
    if (!b || !b.html) return '<div class="card empty">No detail loaded. Run npm run insights:mart.</div>';
    var h = '<article class="doc"><h1>' + esc(b.title) + '</h1>';
    if (b.as_of) h += '<p class="doc-asof">As of ' + esc(b.as_of) + '</p>';
    return h + stripH1(b.html) + '</article>';
  }

  V.detail = { render: render, stripH1: stripH1 };

  if (g.document && g.document.getElementById && g.document.getElementById('app')) {
    V.app.boot('detail', '', '', render);
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function () {
  'use strict';
  var KEYSEP = '\n';
  var TABS = [
    { id: 'brief', label: 'Brief', render: function (d) { return Velora.brief.render({ brief: d.brief }); } },
    { id: 'test-plan', label: 'Test plan', render: function (d) { return Velora.testPlan.render({ test_plan: d.test_plan }); } },
    { id: 'detail', label: 'Detail', render: function (d) { return Velora.detail.render({ brief_full: d.brief_full }); } }
  ];
  var root = document.getElementById('review');
  var vault = JSON.parse(document.getElementById('vault').textContent);
  var subtle = window.crypto && window.crypto.subtle;
  var KEY_RE = /^[A-Za-z0-9_-]{32,}$/;
  var linkKey = ''; // memory only (also lives in the URL fragment); never stored anywhere else
  function parseHash() {
    var h = (location.hash || '').replace(/^#/, ''), i = h.indexOf('/');
    var k = i < 0 ? h : h.slice(0, i);
    return { key: KEY_RE.test(k) ? k : '', tab: i < 0 ? '' : h.slice(i + 1) };
  }
  linkKey = parseHash().key;

  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  async function decrypt(password) {
    var enc = new TextEncoder();
    var base = await subtle.importKey('raw', enc.encode(password + KEYSEP + linkKey), 'PBKDF2', false, ['deriveKey']);
    var key = await subtle.deriveKey({ name: 'PBKDF2', hash: vault.kdf.hash, iterations: vault.kdf.iterations, salt: b64(vault.kdf.salt) },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: b64(vault.iv) }, key, b64(vault.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function lock() {
    root.innerHTML = '<div class="rv-lock"><form class="rv-card card" id="rv-form" autocomplete="off">' +
      '<h1>Velora review</h1><p class="muted">This page is private. Enter the password to open it.</p>' +
      '<label class="rv-label" for="rv-pw">Password</label>' +
      '<input id="rv-pw" class="rv-input" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">' +
      '<button class="rv-btn" id="rv-go" type="submit">Open</button>' +
      '<p class="rv-msg" id="rv-msg" role="alert"></p></form></div>';
    var msg = document.getElementById('rv-msg');
    var input = document.getElementById('rv-pw'), go = document.getElementById('rv-go');
    if (!linkKey) {
      msg.textContent = 'This link is incomplete. Open the full link you were sent.';
      go.disabled = true; input.disabled = true;
      return;
    }
    if (!subtle) {
      msg.textContent = 'This browser cannot decrypt the page (WebCrypto is unavailable). Open it in a current Chrome, Edge, Safari or Firefox over https.';
      go.disabled = true; input.disabled = true;
      return;
    }
    document.getElementById('rv-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pw = input.value.trim();
      if (!pw) { msg.textContent = 'Incorrect password or link.'; return; }
      msg.textContent = 'Checking...'; go.disabled = true;
      var isWrong = function (e) { return e && (e.name === 'OperationError' || e.name === 'InvalidAccessError'); };
      // A phone keyboard may capitalise the first letter; retry once in lower case.
      decrypt(pw).catch(function (e) {
        if (isWrong(e) && pw !== pw.toLowerCase()) return decrypt(pw.toLowerCase());
        throw e;
      }).then(show, function (e) {
        msg.textContent = isWrong(e) ? 'Incorrect password or link.' : 'Could not unlock in this browser. Try a current Chrome, Edge, Safari or Firefox over https.';
        input.value = ''; go.disabled = false; input.focus();
      });
    });
    input.focus();
  }

  function show(data) {
    var tabs = TABS.map(function (t) {
      return '<button type="button" role="tab" class="rv-tab" id="tab-' + t.id + '" data-tab="' + t.id + '" aria-controls="panel-' + t.id + '" tabindex="-1" aria-selected="false">' + t.label + '</button>';
    }).join('');
    var panels = TABS.map(function (t) {
      var html;
      try { html = t.render(data); } catch (e) { html = '<div class="card empty">This tab could not be drawn.</div>'; }
      return '<section role="tabpanel" class="rv-panel" id="panel-' + t.id + '" aria-labelledby="tab-' + t.id + '" hidden>' + html + '</section>';
    }).join('');
    root.innerHTML = '<div class="rv-top"><div class="wrap"><span class="brand">Velora review</span><div class="rv-tabs" role="tablist" aria-label="Review sections">' + tabs + '</div></div></div>' +
      '<main class="wrap">' + panels + '<footer>Private review copy. Platform numbers are platform-claimed. Shopify is the revenue ground truth.</footer></main>';
    var buttons = Array.prototype.slice.call(root.querySelectorAll('.rv-tab'));
    function idFromHash() {
      var h = parseHash().tab;
      return TABS.some(function (t) { return t.id === h; }) ? h : TABS[0].id;
    }
    function select(id, opts) {
      buttons.forEach(function (b) {
        var on = b.getAttribute('data-tab') === id;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        document.getElementById('panel-' + b.getAttribute('data-tab')).hidden = !on;
        if (on && opts && opts.focus) b.focus();
      });
      var want = '#' + linkKey + '/' + id;
      if (opts && opts.hash && location.hash !== want) {
        try { history.replaceState(null, '', want); } catch (e) { location.hash = want.slice(1); }
      }
      window.scrollTo(0, 0);
    }
    buttons.forEach(function (b, i) {
      b.addEventListener('click', function () { select(b.getAttribute('data-tab'), { hash: true }); });
      b.addEventListener('keydown', function (ev) {
        var n = null;
        if (ev.key === 'ArrowRight') n = (i + 1) % buttons.length;
        else if (ev.key === 'ArrowLeft') n = (i + buttons.length - 1) % buttons.length;
        else if (ev.key === 'Home') n = 0;
        else if (ev.key === 'End') n = buttons.length - 1;
        if (n === null) return;
        ev.preventDefault();
        select(buttons[n].getAttribute('data-tab'), { hash: true, focus: true });
      });
    });
    window.addEventListener('hashchange', function () { select(idFromHash()); });
    select(idFromHash(), { hash: true });
  }

  lock();
})();
</script>
